; IceDrone bench-test firmware
; See docs/04_FIRMWARE.md for the rationale behind these settings.
[platformio]
src_dir = .

[env:xiao_esp32s3_sense]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI PSRAM, board default per docs/04_FIRMWARE.md
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_XIAO_ESP32S3
