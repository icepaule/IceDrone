<text x="550" y="112" class="s" font-weight="bold">Orientation</text><text x="550" y="130" class="s">A rail is the RIGHT edge in this solder-side view; J rail is the LEFT edge.</text>
<text x="550" y="155" class="s" font-weight="bold">Rails</text><text x="550" y="173" class="s">A1–A24 = VBAT. J1–J24 = GND. Use 0.6–0.8 mm tinned copper.</text>
<text x="550" y="198" class="s" font-weight="bold">M1</text><text x="550" y="216" class="s">A2→B2; C2→D2; E2→J2; gate E3; R1 E3→F3; R5 E3→F4→J4; PWM F3→B9.</text>
<text x="550" y="241" class="s" font-weight="bold">M2</text><text x="550" y="259" class="s">A6→B6; C6→D6; E6→J6; gate E7; R2 E7→F7; R6 E7→F8→J8; PWM F7→C9 / GPIO44.</text>
<text x="550" y="284" class="s" font-weight="bold">M3</text><text x="550" y="302" class="s">A14→B14; C14→D14; E14→J14; gate E15; R3 E15→F15; R7 E15→F16→J16; PWM F15→D9.</text>
<text x="550" y="327" class="s" font-weight="bold">M4</text><text x="550" y="345" class="s">A19→B19; C19→D19; E19→J19; gate E20; R4 E20→F20; R8 E20→F21→J21; PWM F20→E9.</text>
<text x="550" y="370" class="s" font-weight="bold">Flyback</text><text x="550" y="388" class="s">D1–D4 SS34-class ≥3A: anode at motor−/drain C2/C6/C14/C19; cathode band at VBAT</text><text x="550" y="405" class="s">B2/B6/B14/B19.</text>
<text x="550" y="430" class="s" font-weight="bold">Power</text><text x="550" y="448" class="s">C1 470µF/10V B10+ C10−; C2 100µF/10V B11+ C11−. Boost 5V G12 → D5 → H12 XIAO 5V.</text>
<text x="550" y="473" class="s" font-weight="bold">Signals</text><text x="550" y="491" class="s">B9 M1 GPIO4; C9 M2 GPIO44; D9 M3 GPIO6; E9 M4 GPIO5; F9 ADC; G9 SDA GPIO2; H9 SCL</text><text x="550" y="508" class="s">GPIO43; I9 gimbal GPIO42.</text>
<text x="550" y="533" class="s" font-weight="bold">Sensors</text><text x="550" y="551" class="s">GY: G23 3V3, H23 SDA, I23 SCL, J23 GND. VL: F24 VIN, G24 SHDN optional, H24 SDA, I24</text><text x="550" y="568" class="s">SCL, J24 GND.</text>
<text x="550" y="593" class="s" font-weight="bold">Checks</text><text x="550" y="611" class="s">After every stage verify intended continuity and no VBAT↔GND hard short. Props removed</text><text x="550" y="628" class="s">for all electrical bench work.</text>
</svg>