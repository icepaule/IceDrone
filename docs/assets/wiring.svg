<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850">
<style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#222;stroke-width:2.5}.wire{stroke:#222;stroke-width:3;fill:none}.title{font-size:30px;font-weight:bold}.t{font-size:20px}.s{font-size:17px}</style>
<text x="40" y="45" class="title">V1 wiring overview (one motor stage expanded)</text>
<rect x="55" y="90" width="280" height="330" rx="18" class="box"/><text x="90" y="130" class="t">XIAO ESP32-S3 Sense</text>
<text x="90" y="175" class="s">GPIO4  rear-left</text><text x="90" y="205" class="s">GPIO3  rear-right</text><text x="90" y="235" class="s">GPIO6  front-right</text><text x="90" y="265" class="s">GPIO5  front-left</text><text x="90" y="310" class="s">GPIO2  SDA</text><text x="90" y="340" class="s">GPIO43 SCL</text><text x="90" y="385" class="s">GPIO1  VBAT ADC</text>
<rect x="55" y="500" width="280" height="160" rx="18" class="box"/><text x="110" y="545" class="t">GY-91</text><text x="95" y="585" class="s">VCC=3V3 · GND</text><text x="95" y="615" class="s">SDA=GPIO2 · SCL=GPIO43</text>
<path d="M210 420 L210 500" class="wire"/>
<rect x="455" y="105" width="700" height="500" rx="20" class="box"/><text x="500" y="145" class="t">Motor channel example</text>
<text x="505" y="200" class="t">VBAT</text><path d="M570 195 L790 195" class="wire"/>
<rect x="790" y="165" width="150" height="60" class="box"/><text x="825" y="203" class="t">8520 motor</text>
<path d="M940 195 L1010 195 L1010 315" class="wire"/>
<rect x="960" y="315" width="105" height="90" class="box"/><text x="982" y="350" class="t">AO3400A</text><text x="980" y="380" class="s">D  G  S</text>
<path d="M1010 405 L1010 500" class="wire"/><text x="980" y="530" class="t">GND</text>
<path d="M1010 195 L1120 195 L1120 315 L1065 315" class="wire"/><text x="1080" y="270" class="s">SS14</text><text x="1080" y="292" class="s">A→drain, K→VBAT</text>
<path d="M335 175 L525 175 L525 355 L960 355" class="wire"/><text x="560" y="340" class="s">GPIO → 100Ω → Gate</text>
<path d="M900 355 L900 470" class="wire"/><text x="825" y="445" class="s">100k pulldown</text><path d="M900 470 L1010 470" class="wire"/>
<rect x="480" y="650" width="650" height="120" rx="18" class="box"/><text x="515" y="690" class="t">Battery rail</text><text x="515" y="725" class="s">1S battery → 470µF bulk → motors + XIAO BAT</text><text x="515" y="752" class="s">100k/100k divider → GPIO1 for calibrated VBAT measurement</text>
</svg>