<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:Arial,sans-serif;fill:#111827}.title{font-size:34px;font-weight:700}.h{font-size:24px;font-weight:700}.t{font-size:18px}.card{fill:#f8fafc;stroke:#334155;stroke-width:2.5}.pad{fill:#d97706}.part{fill:#374151}.solder{fill:#cbd5e1;stroke:#64748b;stroke-width:2}.bad{fill:#fff1f2;stroke:#be123c}.good{fill:#ecfdf5;stroke:#047857}</style>
<text x="60" y="60" class="title">Nach dem Reflow — vier typische Sichtprüfungen</text>
<g transform="translate(70,140)"><rect width="700" height="290" rx="22" class="good"/><text x="30" y="45" class="h">Gut: beidseitig benetzt</text><rect x="130" y="160" width="150" height="35" class="pad"/><rect x="420" y="160" width="150" height="35" class="pad"/><rect x="275" y="120" width="150" height="95" rx="10" class="part"/><path d="M240 160 Q275 115 315 160 L315 195 L240 195 Z" class="solder"/><path d="M385 160 Q425 115 460 160 L460 195 L385 195 Z" class="solder"/><text x="30" y="255" class="t">Lot zieht sauber vom Pad zum Anschluss; Bauteil liegt flach.</text></g>
<g transform="translate(830,140)"><rect width="700" height="290" rx="22" class="bad"/><text x="30" y="45" class="h">Fehler: Lötbrücke</text><rect x="130" y="160" width="140" height="35" class="pad"/><rect x="430" y="160" width="140" height="35" class="pad"/><rect x="280" y="120" width="140" height="95" rx="10" class="part"/><path d="M245 160 C315 105 385 105 455 160 L455 195 L245 195 Z" class="solder"/><text x="30" y="255" class="t">Zwei Netze verbunden — Flux + feine Entlötlitze verwenden.</text></g>
<g transform="translate(70,500)"><rect width="700" height="290" rx="22" class="bad"/><text x="30" y="45" class="h">Fehler: Tombstone</text><rect x="130" y="190" width="160" height="35" class="pad"/><rect x="420" y="190" width="160" height="35" class="pad"/><rect x="300" y="95" width="90" height="150" rx="8" class="part" transform="rotate(-18 345 170)"/><path d="M255 190 Q300 150 330 190 L330 225 L255 225 Z" class="solder"/><text x="30" y="255" class="t">Ein Ende steht hoch — erneut flach positionieren und schonend reflowen.</text></g>
<g transform="translate(830,500)"><rect width="700" height="290" rx="22" class="bad"/><text x="30" y="45" class="h">Fehler: unbenetzt / zu wenig Lot</text><rect x="130" y="190" width="160" height="35" class="pad"/><rect x="420" y="190" width="160" height="35" class="pad"/><rect x="280" y="130" width="160" height="95" rx="10" class="part"/><ellipse cx="245" cy="190" rx="28" ry="14" class="solder"/><text x="30" y="255" class="t">Anschluss liegt sichtbar trocken — Flux + kontrollierte Nacharbeit.</text></g>
</svg>