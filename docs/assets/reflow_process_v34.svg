<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
<style>
text{font-family:Arial,sans-serif;fill:#111827}.title{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:18px}.box{fill:#f8fafc;stroke:#334155;stroke-width:2.5}.arrow{stroke:#475569;stroke-width:4;marker-end:url(#a)}.ok{fill:#ecfdf5;stroke:#059669}.warn{fill:#fff7ed;stroke:#ea580c}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<text x="50" y="55" class="title">IceDrone V3.4 — Reflow-Ablauf Sn42Bi58</text>
<g transform="translate(45,110)">
<rect width="220" height="155" rx="20" class="box"/><text x="110" y="45" text-anchor="middle" class="label">1. Reinigen</text><text x="110" y="84" text-anchor="middle" class="small">PCB + Stencil</text><text x="110" y="112" text-anchor="middle" class="small">IPA, trocken</text>
</g>
<g transform="translate(305,110)">
<rect width="220" height="155" rx="20" class="box"/><text x="110" y="45" text-anchor="middle" class="label">2. Drucken</text><text x="110" y="84" text-anchor="middle" class="small">Kapton-Scharnier</text><text x="110" y="112" text-anchor="middle" class="small">45–60° Rakel</text>
</g>
<g transform="translate(565,110)">
<rect width="220" height="155" rx="20" class="box"/><text x="110" y="45" text-anchor="middle" class="label">3. Bestücken</text><text x="110" y="84" text-anchor="middle" class="small">SMD + Polarität</text><text x="110" y="112" text-anchor="middle" class="small">THT noch nicht</text>
</g>
<g transform="translate(825,110)">
<rect width="220" height="155" rx="20" class="warn"/><text x="110" y="45" text-anchor="middle" class="label">4. Reflow</text><text x="110" y="84" text-anchor="middle" class="small">Preheat + Hot Air</text><text x="110" y="112" text-anchor="middle" class="small">PCB Peak ~155–165°C</text>
</g>
<g transform="translate(1085,110)">
<rect width="220" height="155" rx="20" class="box"/><text x="110" y="45" text-anchor="middle" class="label">5. Prüfen</text><text x="110" y="84" text-anchor="middle" class="small">Lupe/Mikroskop</text><text x="110" y="112" text-anchor="middle" class="small">Brücken / Tombstones</text>
</g>
<g transform="translate(1345,110)">
<rect width="210" height="155" rx="20" class="ok"/><text x="105" y="45" text-anchor="middle" class="label">6. Messen</text><text x="105" y="84" text-anchor="middle" class="small">VBAT/GND</text><text x="105" y="112" text-anchor="middle" class="small">erst dann THT + Power</text>
</g>
<line x1="265" y1="188" x2="300" y2="188" class="arrow"/><line x1="525" y1="188" x2="560" y2="188" class="arrow"/><line x1="785" y1="188" x2="820" y2="188" class="arrow"/><line x1="1045" y1="188" x2="1080" y2="188" class="arrow"/><line x1="1305" y1="188" x2="1340" y2="188" class="arrow"/>
<rect x="55" y="325" width="1490" height="95" rx="18" class="warn"/><text x="800" y="365" text-anchor="middle" class="label">Stencil wird vor dem Reflow entfernt</text><text x="800" y="397" text-anchor="middle" class="small">Das größere Stencil bleibt am Arbeitsplatz und kommt nie auf den YIHUA-Vorheizer.</text>
</svg>